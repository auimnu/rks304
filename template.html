<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="min-h-screen bg-stone-100 text-slate-900">
  <header class="border-b border-stone-200 bg-white px-5 py-4">
    <div class="mx-auto flex max-w-6xl items-center justify-between">
      <h1 class="text-lg font-semibold">Ruang Stok</h1>
      <a href="index.html" class="rounded-lg border border-stone-200 px-4 py-2 text-sm hover:bg-stone-50">Logout</a>
    </div>
  </header>
  <div class="mx-auto grid max-w-6xl gap-5 px-5 py-6 md:grid-cols-[190px_1fr]">
    <aside class="self-start rounded-xl border border-stone-200 bg-white p-2">
      <nav class="grid grid-cols-4 gap-1 text-sm md:grid-cols-1">
        <a href="template.html" class="flex items-center justify-center gap-2 rounded-lg bg-emerald-700 px-3 py-2.5 text-white md:justify-start"><i data-lucide="layout-dashboard" class="h-4 w-4"></i><span>Dashboard</span></a>
        <a href="products.html" class="flex items-center justify-center gap-2 rounded-lg px-3 py-2.5 text-slate-600 hover:bg-stone-100 md:justify-start"><i data-lucide="package" class="h-4 w-4"></i><span>Products</span></a>
        <a href="user.html" class="flex items-center justify-center gap-2 rounded-lg px-3 py-2.5 text-slate-600 hover:bg-stone-100 md:justify-start"><i data-lucide="user" class="h-4 w-4"></i><span>Users</span></a>
        <a href="setting.html" class="flex items-center justify-center gap-2 rounded-lg px-3 py-2.5 text-slate-600 hover:bg-stone-100 md:justify-start"><i data-lucide="settings" class="h-4 w-4"></i><span>Settings</span></a>
      </nav>
    </aside>
    <main>
      <p class="text-sm font-medium text-emerald-700">Ringkasan Hari Ini</p>
      <h2 class="mb-5 text-2xl font-semibold">Catatan Operasional</h2>
      <section class="grid gap-4 sm:grid-cols-2 lg:grid-cols-2">
        <article class="rounded-xl border border-stone-200 bg-white p-5"><i data-lucide="receipt-text" class="mb-4 h-5 w-5 text-emerald-700"></i><p class="text-sm text-slate-500">Transaksi</p><h3 class="mt-2 text-2xl font-semibold">36</h3></article>
        <article class="rounded-xl border border-stone-200 bg-white p-5"><i data-lucide="archive" class="mb-4 h-5 w-5 text-sky-700"></i><p class="text-sm text-slate-500">Stok Tersedia</p><h3 class="mt-2 text-2xl font-semibold">412</h3></article>
        <article class="rounded-xl border border-stone-200 bg-white p-5"><i data-lucide="alert-circle" class="mb-4 h-5 w-5 text-amber-700"></i><p class="text-sm text-slate-500">Stok Menipis</p><h3 class="mt-2 text-2xl font-semibold">7</h3></article>
        <article class="rounded-xl border border-stone-200 bg-white p-5"><i data-lucide="clipboard-check" class="mb-4 h-5 w-5 text-violet-700"></i><p class="text-sm text-slate-500">Dicek Ulang</p><h3 class="mt-2 text-2xl font-semibold">18</h3></article>
      </section>
    </main>
  </div>
  <script>lucide.createIcons();</script>
</body>
</html>
