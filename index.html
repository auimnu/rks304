<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="min-h-screen bg-stone-100 text-slate-900">
  <main class="flex min-h-screen items-center justify-center px-5">
    <section class="w-full max-w-sm rounded-xl border border-stone-200 bg-white p-6 shadow-sm">
      <div class="mb-6 text-center">
        <span class="mx-auto mb-3 grid h-11 w-11 place-items-center rounded-lg bg-emerald-50 text-emerald-700">
          <i data-lucide="lock-keyhole" class="h-5 w-5"></i>
        </span>
        <h1 class="text-xl font-semibold">Ruang Stok</h1>
        <p class="mt-1 text-sm text-slate-500">Masuk ke halaman pengelolaan.</p>
      </div>
      <form action="template.html" method="get" class="space-y-4">
        <label class="block">
          <span class="text-sm font-medium text-slate-700">Username</span>
          <input type="text" name="username" required class="mt-1 w-full rounded-lg border border-stone-200 px-3 py-2.5 outline-none focus:border-emerald-500 focus:ring-2 focus:ring-emerald-100">
        </label>
        <label class="block">
          <span class="text-sm font-medium text-slate-700">Password</span>
          <input type="password" name="password" required class="mt-1 w-full rounded-lg border border-stone-200 px-3 py-2.5 outline-none focus:border-emerald-500 focus:ring-2 focus:ring-emerald-100">
        </label>
        <button type="submit" class="flex w-full items-center justify-center gap-2 rounded-lg bg-emerald-700 px-4 py-2.5 font-medium text-white hover:bg-emerald-800">
          <i data-lucide="log-in" class="h-4 w-4"></i> Masuk
        </button>
      </form>
    </section>
  </main>
  <script>lucide.createIcons();</script>
</body>
</html>
