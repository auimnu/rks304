<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tambah Barang</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="min-h-screen bg-[#f6f7f4] text-slate-900">
  <header class="border-b border-slate-200 bg-white px-5 py-4">
    <div class="mx-auto flex max-w-4xl items-center justify-between">
      <h1 class="text-lg font-semibold">Ruang Stok</h1>
      <a href="index.html" class="rounded-xl border border-slate-200 px-4 py-2 text-sm font-medium hover:bg-slate-50">Logout</a>
    </div>
  </header>
  <main class="mx-auto grid max-w-4xl gap-6 px-5 py-8 md:grid-cols-[.8fr_1.2fr]">
    <section>
      <a href="products.html" class="mb-6 inline-flex items-center gap-2 text-sm font-medium text-slate-600 hover:text-teal-700"><i data-lucide="arrow-left" class="h-4 w-4"></i>Back</a>
      <p class="text-sm font-medium text-teal-700">Input Barang</p>
      <h2 class="mt-1 text-3xl font-semibold">Tambah Data</h2>
      <p class="mt-3 text-slate-500">Masukkan barang baru agar stok lebih mudah dipantau.</p>
    </section>
    <form class="rounded-2xl border border-slate-200 bg-white p-6 shadow-sm">
      <div class="grid gap-4">
        <label class="block"><span class="text-sm font-medium text-slate-700">Name</span><input type="text" required placeholder="Masukkan nama barang" class="mt-1 w-full rounded-xl border border-slate-200 px-4 py-3 outline-none focus:border-teal-500 focus:ring-4 focus:ring-teal-100"></label>
        <label class="block"><span class="text-sm font-medium text-slate-700">Stock</span><input type="number" required min="0" placeholder="Masukkan jumlah stock" class="mt-1 w-full rounded-xl border border-slate-200 px-4 py-3 outline-none focus:border-teal-500 focus:ring-4 focus:ring-teal-100"></label>
        <label class="block"><span class="text-sm font-medium text-slate-700">Description</span><textarea required rows="4" placeholder="Masukkan deskripsi barang" class="mt-1 w-full rounded-xl border border-slate-200 px-4 py-3 outline-none focus:border-teal-500 focus:ring-4 focus:ring-teal-100"></textarea></label>
      </div>
      <div class="mt-6 flex flex-col-reverse gap-3 sm:flex-row">
        <a href="products.html" class="inline-flex flex-1 items-center justify-center gap-2 rounded-xl border border-slate-200 px-4 py-3 font-medium hover:bg-slate-50"><i data-lucide="x" class="h-4 w-4"></i>Back</a>
        <a href="products.html" class="inline-flex flex-1 items-center justify-center gap-2 rounded-xl bg-slate-950 px-4 py-3 font-medium text-white hover:bg-teal-700"><i data-lucide="check" class="h-4 w-4"></i>Simpan Barang</a>
      </div>
    </form>
  </main>
  <script>lucide.createIcons();</script>
</body>
</html>
